name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project with test extras
        run: |
          python -m pip install --upgrade pip
          # Runtime deps live in [project.dependencies]; backends exercised
          # by the test suite live in [project.optional-dependencies.test].
          # Heavy extras (snapatac2 / torch / MOODS / pyjaspar) stay out —
          # tests that need them use pytest.importorskip.
          pip install -e '.[test]'

      - name: Import smoke test
        run: |
          python -c "import epione; print('epione', getattr(epione, '__version__', 'dev'))"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: |
          pytest tests/ -x --tb=short --timeout=120

  torch-backend:
    # The torch code paths behind every `device=` argument, run on the CPU
    # (device="torch-cpu") against the NumPy / SciPy paths. CUDA-only tests
    # skip here; there is no GPU on the runner.
    name: torch backend on CPU (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project with test extras and CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'

      - name: Run GPU-backend tests
        env:
          MPLBACKEND: Agg
        run: |
          pytest tests/test_gpu.py tests/test_gpu_torch.py --tb=short --timeout=300
