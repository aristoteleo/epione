# port.yaml — machine-readable manifest read by omicverse.org/ports
# Spec: https://github.com/omicverse/omicverse-org-home/blob/main/docs/PORT_MANIFEST.md
# functions[] first generated by `python -m engine.r_function_audit --port-yaml` (2026-11-09),
# then hand-reviewed. The port lives inside epione (epione.tl), not in a py-cicero repository.
schema: omicverse-port/v1
package: epione
pypi: epione
import_name: epione
language: python
domain: single-cell

upstream:
  name: cicero
  source: GitHub
  version: "1.3.9"
  url: https://github.com/cole-trapnell-lab/cicero-release/tree/monocle3
  commit: 495ef0da13cc9ffe55516bfd34f48b671ad55aba
  license: MIT
  citation: "Pliner HA et al. (2018) Mol Cell 71:858-871"

omicverse:
  module: epione.tl.run_cicero
  since: null

parity:
  status: partial                   # all deterministic gates pass; stochastic Louvain gate 16 fails on F1 (ARI 0.935 < 0.95)
  algorithm_class: multi
  metric: "coaccess max abs err vs R (gate 9); Pearson (gate 10); CCAN ARI (gate 16)"
  threshold: "1e-8; 0.9999; 0.95"
  value: "F1 8.0e-16 / 1.0 / 0.935; F2 4.4e-16 / 1.0 / 0.995"
  fixture: "cicero_data (200 cells x 6,146 peaks, hg19 chr18); E8.5 heart multiome chr19 (16,787 cells x 8,927 peaks)"
  test: tests/test_cicero.py

artifacts:
  audit: tests/parity/cicero/AUDIT.md
  report: tests/parity/cicero/RECONSTRUCTION_REPORT.md
  manifest: tests/parity/cicero/manifest.yaml
  compare_notebook: tests/parity/cicero/examples/compare_R_vs_Python.ipynb
  tutorial_notebook: epione_guide/tutorials/single/t_cicero.ipynb
  function_notebook: tests/parity/cicero/examples/function_by_function_R_parity.ipynb
  evolution_notebook: tests/parity/cicero/examples/evolution.ipynb

functions:
- r: make_cicero_cds
  py: epione.tl.make_cicero_cds
  status: ported
  parity: exact
  note: "bins identical with rng='R' (RRandom == set.seed); random_state / rng / chosen / layer are new"
- r: estimate_distance_parameter
  py: epione.tl.estimate_distance_parameter
  status: ported
  parity: exact
  note: "per-window values within 3e-15 relative, mean bit-identical; genomic_coords has no hg19 default"
- r: generate_cicero_models
  py: epione.tl.generate_cicero_models
  status: ported
  parity: exact
- r: assemble_connections
  py: epione.tl.assemble_connections
  status: ported
  parity: exact
  note: "same rows, same order (data.table key), max abs err <= 8e-16"
- r: run_cicero
  py: epione.tl.run_cicero
  status: ported
  parity: exact
- r: generate_ccans
  py: epione.tl.generate_ccans
  status: ported
  parity: approx
  note: "Louvain RNG differs (R igraph uses R's RNG); ARI vs R 0.935-1.0 (F1), 0.97-1.0 (F2)"
- r: find_overlapping_ccans
  py: epione.tl.find_overlapping_ccans
  status: ported
  parity: exact
- r: annotate_cds_by_site
  py: epione.tl.annotate_cds_by_site
  status: partial
  parity: exact
  note: "maxgap = 'nearest' not ported"
- r: build_gene_activity_matrix
  py: epione.tl.build_gene_activity_matrix
  status: ported
  parity: exact
  note: "returns cells x genes (R: genes x cells)"
- r: normalize_gene_activities
  py: epione.tl.normalize_gene_activities
  status: ported
  parity: exact
- r: make_atac_cds
  py: epione.tl.make_atac_cds
  status: ported
  parity: exact
- r: aggregate_nearby_peaks
  py: epione.tl.aggregate_nearby_peaks
  status: ported
  parity: exact
- r: aggregate_by_cell_bin
  py: epione.tl.aggregate_by_cell_bin
  status: ported
  parity: exact
- r: compare_connections
  py: epione.tl.compare_connections
  status: ported
  parity: exact
- r: find_overlapping_coordinates
  py: epione.tl.find_overlapping_coordinates
  status: ported
  parity: exact
- r: df_for_coords
  py: epione.tl.df_for_coords
  status: ported
  parity: exact
- r: ranges_for_coords
  py: null
  status: skipped
  note: "returns a Bioconductor GRanges; df_for_coords gives the same coordinates"
- r: plot_connections
  py: null
  status: skipped
  note: "Gviz plotting; use epione.pl.plot_browser_track / epione.pl.igv_browser"
- r: plot_accessibility_in_pseudotime
  py: null
  status: skipped
  note: "ggplot2 plotting, out of scope"
- r: "glasso::glasso (dependency)"
  py: epione.tl.glasso
  status: partial
  parity: exact
  note: "cold start, approx = FALSE path (the one Cicero uses); nobs/zero/warm start/trace not ported"
