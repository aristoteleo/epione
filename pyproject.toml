[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"



[project]
name = "epione"
version = "0.0.1rc1"
description = "EpiOne: Generative cartography of single-cell epigenomes"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Zehua Zeng", email = "starlitnightly@gmail.com"},
]
keywords = ["bioinformatics", "deep-learning", "single-cell", "ATAC-seq"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    # Core scientific stack — imported at package load time.
    'numpy',
    'scipy',
    'pandas',
    'scikit-learn',
    'matplotlib',
    'seaborn',
    'networkx',
    'tqdm',
    'requests',
    'h5py',
    'kneed',
    'pooch',
    # Genomics IO + data structures — imported at package load time.
    'anndata',
    'mudata',
    'muon>=0.1',
    'scanpy',
    'pyBigWig>=0.3',
    'pysam',
    'pyranges',
    'pyfaidx',
    'biopython',     # epione.core.motifs: `from Bio import motifs`
    # Misc imported at load time.
    'colormaps',
    # Legacy single-cell paths.
    'loompy>=3.0.7',
]

[project.optional-dependencies]
# Extras pulled in only when the matching feature is actually called.
# Kept out of `dependencies` so `pip install epione` stays lightweight.
cnv = [
    'scikit-misc',   # epione.tl.cnv GC correction (same dloess code as R stats::loess)
]
diffexp = [
    'patsy',         # design matrices for edgepy backend
    'pydeseq2',
    'inmoose',
]
motif = [
    'MOODS-python',
    'pyjaspar',
    'torch',         # find_motifs_genome GPU PWM scan
    'mpmath',        # extreme-tail binomial
    'logomaker',     # PWM logos in epione.pl.homer_motif_table
]
footprint = [
    'MOODS-python',
    'pyjaspar',
    'deeptoolsintervals',
    'pynndescent',
]
seq2print = [
    'torch',
    'safetensors',   # epione.models.seq2print.load_pretrained (Hugging Face weights)
]
upstream = [
    # Heavy single-cell preprocessing; pulls Rust deps.
    'snapatac2',
]
hic = [
    # Hi-C matrix IO + balancing + analysis (epione.hic).
    'cooler>=0.10',
    'cooltools>=0.7',
    'pairtools>=1.0',
    'bioframe',
    'tables',        # epione.bulk.hic.h5_to_cool (HiCExplorer .h5 matrices)
]
higashi = [
    # epione.single.hic impute_cells / embedding with method="higashi"
    'torch>=2.0',
    'cooler>=0.10',
]
test = [
    'pytest>=7',
    'pytest-timeout',
    # Backends + extras exercised by test_tl_differential / test_pl_differential.
    'patsy',
    'pydeseq2',
    'inmoose',
    # pychromvar is lazy-imported by tl._background_peaks and exercised by
    # the existing tests/test_chromvar.py tests.
    'pychromvar',
    # igraph + leidenalg drive the community-detection path used by
    # tl._coaccessibility (tests/test_coaccessibility.py).
    'igraph',
    'leidenalg',
    # epione.hic stack (tests/test_hic.py).
    'cooler>=0.10',
    'cooltools>=0.7',
    'pairtools>=1.0',
    'bioframe',
    'tables',        # epione.bulk.hic.h5_to_cool (tests/test_bulk_hic_hicexplorer.py)
    # Parquet engine for models.scooby.export_embedding, which writes
    # the embedding format upstream scooby reads
    # (tests/test_scooby_targets.py).
    'pyarrow',
    # epi.tl.tsne (tests/test_multimodal.py).
    'openTSNE>=1.0',
    # epione.tl.cnv GC correction (tests/test_cnv.py).
    'scikit-misc',
]
translate = [
    # epione.translate methods (scButterfly, ...); prepare/metrics need none of these.
    'torch>=2.0',
]
spatial = [
    # epione.tl.spatialglue (SpatialGlue port) and spatial_domains(method="mclust").
    'torch>=2.0',
    'pymclustR>=0.2.1',
]
pando = [
    # epione.grn.pando: the omicverse port of Pando (R) with its parity tests.
    'pypando[plot]>=0.1.2',
]
grelu = [
    # epione.models.grelu: variant effects / ISM / attributions via gReLU.
    'grelu>=1.1',
]
scenic = [
    # cisTarget feather databases (Arrow IPC) and pycistarget-format hdf5 I/O.
    'pyarrow',
    'tables',
]
multimodal = [
    # epi.tl.multivi, epi.tl.peakvi, epi.tl.scbasset (torch, via scvi-tools),
    # epi.tl.tsne, epi.io.read_10x_multiome(backed=...)
    'scvi-tools>=1.3',
    'openTSNE>=1.0',
    'mudataoom',
]
doublets = [
    # epi.pp.scdblfinder / amulet / clamulet (scATAC mode of the omicverse scDblFinder port).
    'pyscdblfinder>=0.3.0',
    # epi.pp.archr_doublets: Louvain clustering inside the iterative LSI.
    'igraph',
]
gpu = [
    # torch backend of every `device=` argument (epi.tl.lsi / iterative_lsi /
    # compute_deviations / add_motif_matrix / peak_to_gene, epi.pp.neighbors).
    # Install a CUDA build of torch for your driver (https://pytorch.org).
    # The optional backend="rapids" path additionally needs
    # `pip install "rapids-singlecell[rapids-cu12]"` (glibc >= 2.28); it is
    # deliberately not listed here.
    'torch>=2.0',
    'MOODS-python',  # log-odds matrices / thresholds for the GPU motif scan
]
full = [
    'epione[diffexp,motif,footprint,upstream,scenic,pando,translate,multimodal,doublets,higashi,cnv,spatial,gpu]',
]



[project.urls]
Github = 'https://github.com/aristoteleo/epione'

[tool.flit.sdist]
exclude = [".*", "d*", "epione_guide*", "pa*", "s*", "t*"]
